<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bhāṣāntara</title>
<style>
:root{--bg:#faf7f2;--fg:#2a2420;--mut:#7a6f66;--card:#fff;--bd:#e4dccf;--ac:#b4501e;--acfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1815;--fg:#efe7dc;--mut:#a09486;--card:#26221e;--bd:#3a342d;--ac:#e0824f;--acfg:#1b1815}}
:root[data-theme="dark"]{--bg:#1b1815;--fg:#efe7dc;--mut:#a09486;--card:#26221e;--bd:#3a342d;--ac:#e0824f;--acfg:#1b1815}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Courier New",monospace,"Noto Sans Devanagari","Noto Sans Tamil",sans-serif}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--bd);background:var(--card);padding:12px 10px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
#plist{flex:1}
.cz{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px}
#sws{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.sw{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid var(--bd);cursor:pointer}
.sw.on{border-color:var(--fg)}
.sw.def{background:conic-gradient(#b4501e 0 50%,#1b1815 0 100%)}
.cust{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mut)}
#cc{padding:0;width:34px;height:24px;min-width:0;border:1px solid var(--bd);border-radius:6px;background:transparent;cursor:pointer}
.side-h{font-size:.8rem;color:var(--mut);letter-spacing:.04em;margin:0 0 10px}
#np{width:100%;margin-bottom:12px}
.pi{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid transparent;border-radius:8px;cursor:pointer}
.pi:hover{background:var(--bg)}
.pi.on{border-color:var(--ac);background:var(--bg)}
.pt{flex:1;min-width:0;display:flex;flex-direction:column}
.pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}
.pd{color:var(--mut);font-size:.74rem}
.pi .px{padding:2px 8px;font-size:.8rem;color:var(--mut);border:0;background:transparent}
.pe{color:var(--mut);font-size:.82rem}
main{width:100%;max-width:1000px;margin:0;padding:14px 20px 28px}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;max-height:230px;border-right:0;border-bottom:1px solid var(--bd)}}
h1{font-size:1.6rem;margin:0;font-weight:500;letter-spacing:-.01em}
p.s{color:var(--mut);margin:0 0 10px;font-size:.92rem}
textarea{width:100%;min-height:110px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font:1.1rem/1.7 ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Courier New",monospace,"Noto Sans Devanagari","Mangal",sans-serif;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
.tg{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.95rem}
.tg{flex-direction:column;align-items:stretch;gap:10px}
.cbs{display:flex;gap:8px 16px;align-items:baseline}
.cbg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 12px;flex:1}
.opts{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.tg b{color:var(--mut);font-weight:600}
.tg label{cursor:pointer;display:flex;gap:6px;align-items:center}
select{padding:5px 8px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;font-size:.9rem}
button,select,textarea,input{font-family:inherit}
#key,#model,#fn{padding:5px 8px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font-size:.9rem;min-width:260px}
#fn{min-width:0;width:170px;padding:9px 12px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px}
button{padding:9px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;font-size:.95rem;cursor:pointer}
button.p{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
button:disabled{opacity:.5;cursor:default}
#st{color:var(--mut);font-size:.9rem;margin:2px 0;min-height:1.2em}
.out{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-top:8px;overflow-x:auto}
.sh div:focus{outline:1px dashed var(--ac);outline-offset:3px}
.hint{color:var(--mut);font-size:.82rem;margin-top:10px}
.sh{margin-bottom:14px}.sh:last-child{margin-bottom:0}
.dv{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Courier New",monospace,"Noto Sans Devanagari","Mangal",sans-serif;white-space:pre-wrap}
.ia{font-weight:700;white-space:pre-wrap}
.bn{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Courier New",monospace,"Noto Sans Bengali","Nirmala UI",sans-serif;white-space:pre-wrap}
.ta{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Courier New",monospace,"Noto Sans Tamil","Latha",sans-serif;white-space:pre-wrap}
.tr{font-style:italic;color:var(--mut)}
input[type=checkbox]{margin:0;flex:none;width:16px;height:16px;min-width:0;padding:0;accent-color:var(--ac)}
details{margin-top:12px;color:var(--mut);font-size:.9rem}
pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;color:var(--fg);font:.88rem/1.5 ui-monospace,monospace}
</style>
</head>
<body>
<div class="app">
<aside id="side">
<div class="side-h">recent projects</div>
<button id="np" type="button">+ new project</button>
<div id="plist"></div>
<div class="cz"><div class="side-h">ui color</div><div id="sws"></div><label class="cust">custom <input type="color" id="cc" value="#b4501e"></label></div>
</aside>
<main>
<div class="hd"><h1>bhāṣāntara</h1><button id="th" type="button">dark</button></div>
<p class="s">paste one or more shlokas (ending in ॥ n ॥ or separated by blank lines). transliteration runs locally; the english translation is generated by claude (pick a translator below).</p>
<textarea id="in" placeholder="input text…"></textarea>
<div class="tg">
<div class="cbs"><b>output:</b><div class="cbg">
<label><input type="checkbox" id="oD" checked> devanagari</label>
<label><input type="checkbox" id="oT"> tamil</label>
<label><input type="checkbox" id="oB"> bengali/assamese</label>
<label><input type="checkbox" id="oI" checked> roman</label>
<label><input type="checkbox" id="oE" checked> english</label>
</div></div>
<div class="opts">
<label id="rsw">roman <select id="rom"><option value="iast">iast</option><option value="hk">harvard-kyoto</option></select></label>
<label id="bsw" hidden>bengali/assamese <select id="bst"><option value="bengali">bengali</option><option value="assamese">assamese</option></select></label>
<label>translator
<select id="prov"><option value="claude">claude (inside claude only)</option><option value="anthropic">anthropic api key</option><option value="gemini">google gemini api key</option><option value="openrouter">openrouter api key</option></select></label>
<input id="key" type="password" placeholder="e.g. sk-ant-api03-xxxxxxxxxxxxxxxx…" hidden autocomplete="off">
<input id="model" type="text" placeholder="model" hidden autocomplete="off" spellcheck="false" title="model name (editable)">
<label id="tsw" hidden>tamil style
<select id="tst"><option value="sup">superscripts (க, க², க³, க⁴)</option><option value="plain">plain (no superscripts)</option></select></label>
</div>
</div>
<div class="row">
<button class="p" id="go">transliterate &amp; translate</button>
<button id="ex">load example</button>
<button id="cp" disabled>copy markdown</button>
<input id="fn" type="text" placeholder="file name" maxlength="80" autocomplete="off" spellcheck="false" title="name for the .md and .txt downloads (extension is added for you)">
<button id="dm" disabled>download .md</button>
<button id="dt" disabled>download .txt</button>
</div>
<div id="st"></div>
<div id="res"></div>
<details id="rawd" hidden><summary>raw markdown</summary><pre id="raw"></pre></details>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const DG='०१२३४५६७८९',TD='௦௧௨௩௪௫௬௭௮௯';
const C={'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'ṅ','च':'c','छ':'ch','ज':'j','झ':'jh','ञ':'ñ','ट':'ṭ','ठ':'ṭh','ड':'ḍ','ढ':'ḍh','ण':'ṇ','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'ph','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'v','श':'ś','ष':'ṣ','स':'s','ह':'h','ळ':'ḷ'};
const NK={'क':'q','ज':'z','ड':'ṛ','ढ':'ṛh','फ':'f','ग':'ġ','ख':'kh'};
const V={'अ':'a','आ':'ā','इ':'i','ई':'ī','उ':'u','ऊ':'ū','ऋ':'ṛ','ॠ':'ṝ','ऌ':'ḷ','ॡ':'ḹ','ए':'e','ऐ':'ai','ओ':'o','औ':'au','ऑ':'o','ऍ':'e'};
const M={'ा':'ā','ि':'i','ी':'ī','ु':'u','ू':'ū','ृ':'ṛ','ॄ':'ṝ','ॢ':'ḷ','ॣ':'ḹ','े':'e','ै':'ai','ो':'o','ौ':'au','ॉ':'o','ॅ':'e'};
const O={'ं':'ṁ','ः':'ḥ','ँ':'m̐','ऽ':'’','ॐ':'oṁ','।':'/','॥':'//'};
// Tamil: [letter, superscript]
const TC={'क':['க',''],'ख':['க','²'],'ग':['க','³'],'घ':['க','⁴'],'ङ':['ங',''],
'च':['ச',''],'छ':['ச','²'],'ज':['ஜ',''],'झ':['ஜ','²'],'ञ':['ஞ',''],
'ट':['ட',''],'ठ':['ட','²'],'ड':['ட','³'],'ढ':['ட','⁴'],'ण':['ண',''],
'त':['த',''],'थ':['த','²'],'द':['த','³'],'ध':['த','⁴'],'न':['ந',''],
'प':['ப',''],'फ':['ப','²'],'ब':['ப','³'],'भ':['ப','⁴'],'म':['ம',''],
'य':['ய',''],'र':['ர',''],'ल':['ல',''],'व':['வ',''],'श':['ஶ',''],'ष':['ஷ',''],'स':['ஸ',''],'ह':['ஹ',''],'ळ':['ள','']};
const TV={'अ':'அ','आ':'ஆ','इ':'இ','ई':'ஈ','उ':'உ','ऊ':'ஊ','ऋ':'ரு','ॠ':'ரூ','ऌ':'லு','ॡ':'லூ','ए':'ஏ','ऐ':'ஐ','ओ':'ஓ','औ':'ஔ','ऑ':'ஓ','ऍ':'ஏ'};
const TM={'ा':'ா','ि':'ி','ी':'ீ','ु':'ு','ू':'ூ','ृ':'்ரு','ॄ':'்ரூ','ॢ':'்லு','ॣ':'்லூ','े':'ே','ै':'ை','ो':'ோ','ौ':'ௌ','ॉ':'ோ','ॅ':'ே'};
const TO={'ं':'ம்','ँ':'ம்','ः':'ஃ','ऽ':'’','ॐ':'ஓம்','।':'।','॥':'॥'};

function pre(s){return s.normalize('NFC').replace(/[\u200c\u200d]/g,'').replace(/[\u0958-\u095f]/g,c=>c.normalize('NFD'))}
function danda(s){ // anything between a pair of ॥ gets exactly one space on each side, e.g. ॥१८॥ / ॥ १.२॥ -> " ॥ १८ ॥"
  return s.replace(/[ \t]*॥[ \t]*([^॥\n]*?)[ \t]*॥/g,(m,c)=>c?' ॥ '+c+' ॥':' ॥ ॥').replace(/^[ \t]+/gm,'');
}
const HC={'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'G','च':'c','छ':'ch','ज':'j','झ':'jh','ञ':'J','ट':'T','ठ':'Th','ड':'D','ढ':'Dh','ण':'N','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'ph','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'v','श':'z','ष':'S','स':'s','ह':'h','ळ':'L'};
const HV={'अ':'a','आ':'A','इ':'i','ई':'I','उ':'u','ऊ':'U','ऋ':'R','ॠ':'RR','ऌ':'lR','ॡ':'lRR','ए':'e','ऐ':'ai','ओ':'o','औ':'au','ऑ':'o','ऍ':'e'};
const HM={'ा':'A','ि':'i','ी':'I','ु':'u','ू':'U','ृ':'R','ॄ':'RR','ॢ':'lR','ॣ':'lRR','े':'e','ै':'ai','ो':'o','ौ':'au','ॉ':'o','ॅ':'e'};
const HO={'ं':'M','ः':'H','ँ':'M','ऽ':"'",'ॐ':'oM','।':'/','॥':'//'};
const TI={C,NK,V,M,O},TH={C:HC,NK:{},V:HV,M:HM,O:HO};
function rom(s,T){
  s=pre(s);let o='',i=0;
  while(i<s.length){
    const ch=s[i];
    if(T.C[ch]){
      let j=i+1;
      if(s[j]==='़'){o+=T.NK[ch]||T.C[ch];j++}else o+=T.C[ch];
      if(s[j]==='्')j++;else if(T.M[s[j]]){o+=T.M[s[j]];j++}else o+='a';
      i=j;
    }else if(T.V[ch]){o+=T.V[ch];i++}
    else if(T.O[ch]){o+=T.O[ch];i++}
    else if(DG.includes(ch)){o+=DG.indexOf(ch);i++}
    else if(ch==='़'||ch==='्'){i++}
    else{o+=ch;i++}
  }
  return o.replace(/[ \t]+\n/g,'\n').replace(/\/\/ *([^\/\n]*?) *\/\//g,(m,c)=>c?'// '+c+' //':'// //');
}
const iast=s=>rom(s,TI),hk=s=>rom(s,TH);
function tamil(s,sup){
  s=pre(s);let o='',i=0;
  while(i<s.length){
    const ch=s[i];
    if(TC[ch]){
      let j=i+1;if(s[j]==='़')j++;
      const [l,n]=TC[ch];o+=l;
      if(s[j]==='्'){o+='்';j++}else if(TM[s[j]]){o+=TM[s[j]];j++}
      if(sup)o+=n;
      i=j;
    }else if(TV[ch]){o+=TV[ch];i++}
    else if(TO[ch]){o+=TO[ch];i++}
    else if(DG.includes(ch)){o+=TD[DG.indexOf(ch)];i++}
    else if(/[0-9]/.test(ch)){o+=TD[+ch];i++}
    else if(ch==='़'||ch==='्'){i++}
    else{o+=ch;i++}
  }
  return o;
}
const BO={'ऍ':'এ','ऑ':'ও','ॉ':'ো','ॅ':'ে','ॐ':'ওঁ','ळ':'ল'};
function bengali(s,as){
  s=pre(s);let o='';
  for(const ch of s){
    const c=ch.codePointAt(0);
    if(ch==='व')o+=as?'ৱ':'ব';
    else if(ch==='र')o+=as?'ৰ':'র';
    else if(BO[ch])o+=BO[ch];
    else if((c>=0x901&&c<=0x963)||(c>=0x966&&c<=0x96f))o+=String.fromCodePoint(c+0x80);
    else if(/[0-9]/.test(ch))o+=String.fromCodePoint(0x9e6+(+ch));
    else o+=ch;
  }
  return o;
}
function split(t){
  return danda(t.trim()).split(/\n\s*\n/).flatMap(b=>b.split(/(?<=॥[^॥\n]*॥)[ \t]*\n/)).map(x=>x.trim()).filter(Boolean);
}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const EX='नवावरणसम्पूज्या नवाक्षरमनुस्तुता ।\nनवलावण्यरूपाढ्या ज्वलद्द्वात्रिंशतायुधा ॥१३॥';
let items=[],trs=null,md='',edits={};
function build(){
  const oD=$('oD').checked,oI=$('oI').checked,oT=$('oT').checked,oE=$('oE').checked,oB=$('oB').checked,sup=$('tst').value==='sup',as=$('bst').value==='assamese',rv=$('rom').value;
  return items.map((d,i)=>{
    const p=[],add=(c,sfx,t)=>{const k=i+':'+c+sfx;p.push({c,k,t:edits[k]!==undefined?edits[k]:t})};
    if(oD)add('dv','',d);
    if(oT)add('ta',sup?'s':'p',tamil(d,sup));
    if(oB)add('bn',as?'a':'b',bengali(d,as));
    if(oI)add('ia',rv,rv==='hk'?hk(d):iast(d));
    if(oE&&trs&&trs[i]){let t=trs[i].replace(/^\*+|\*+$/g,'').trim();if(t&&!/[.!?…,;:]$/.test(t))t+='.';add('tr','',t)}
    return p;
  });
}
const mk=(c,t)=>c==='ia'?'**'+t+'**':c==='tr'?'*'+t+'*':t;
function sync(blocks){
  md=blocks.map(p=>p.map(x=>mk(x.c,x.t)).join('\n')).join('\n\n');
  $('raw').textContent=md;$('rawd').hidden=false;
  ['cp','dm','dt'].forEach(id=>$(id).disabled=!md);
}
function render(){
  $('tsw').hidden=!$('oT').checked;$('bsw').hidden=!$('oB').checked;$('rsw').hidden=!$('oI').checked;
  if(!items.length)return;
  const blocks=build();
  $('res').innerHTML='<div class="out">'+blocks.map(p=>'<div class="sh">'+p.map(x=>'<div class="'+x.c+'" contenteditable="plaintext-only" spellcheck="false" data-k="'+x.k+'">'+esc(x.t)+'</div>').join('')+'</div>').join('')+'</div><div class="hint">click any line to edit it. edits are kept when you change the toggles and are included in the copy and download.</div>';
  sync(blocks);
}
$('res').addEventListener('input',e=>{
  const el=e.target.closest&&e.target.closest('[data-k]');if(!el)return;
  edits[el.dataset.k]=el.innerText.replace(/\n+$/,'');
  sync(build());
});
const rawText=()=>build().map(p=>p.map(x=>x.t).join('\n')).join('\n\n');
async function save(name,data){
  let d=null;
  try{d=await claude.use('downloads')}catch(e){}
  if(d){
    try{await d.save({filename:name,data});$('st').textContent='saved '+name+'.'}
    catch(e){$('st').textContent=(e&&e.code==='declined')?'download cancelled.':'download failed.'}
    return;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([data],{type:name.endsWith('.txt')?'text/plain':'text/markdown'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  $('st').textContent='downloaded '+name+'.';
}
const fname=ext=>{const n=($('fn').value||'').trim().replace(/\.(md|txt)$/i,'').replace(/[\\\/:*?"<>|\u0000-\u001f]/g,'').replace(/^\.+/,'').trim();return (n||'bhashantara')+'.'+ext};
$('dm').onclick=()=>save(fname('md'),md+'\n');
$('dt').onclick=()=>save(fname('txt'),rawText()+'\n');
['oD','oI','oT','oB','oE','tst','bst','rom'].forEach(id=>$(id).addEventListener('change',()=>{
  render();
  if(id==='oE'&&$('oE').checked&&items.length&&!trs)$('st').textContent='click “transliterate & translate” to generate the translation.';
}));
function curTheme(){return document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function syncTh(){$('th').textContent=curTheme()==='dark'?'light':'dark'}
$('th').onclick=()=>{document.documentElement.dataset.theme=curTheme()==='dark'?'light':'dark';syncTh();applyColor()};
syncTh();
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const PV={anthropic:{ph:'e.g. sk-ant-api03-xxxxxxxxxxxxxxxx…',model:'claude-sonnet-5-5'},gemini:{ph:'e.g. AIzaSyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx',model:'gemini-3.8-flash'},openrouter:{ph:'e.g. sk-or-v1-xxxxxxxxxxxxxxxxxxxxxxxx',model:'google/gemini-2.5-flash'}};
$('prov').value=ls('bh_prov')||'claude';if(!$('prov').value)$('prov').value='claude';
function syncPv(){
  const pv=$('prov').value,c=PV[pv];
  $('key').hidden=$('model').hidden=!c;
  if(c){$('key').placeholder=c.ph;$('key').value=ls('bh_key_'+pv)||(pv==='anthropic'?ls('bh_key'):'')||'';$('model').value=ls('bh_model_'+pv)||c.model}
}
$('prov').onchange=()=>{ls('bh_prov',$('prov').value);syncPv()};
$('key').onchange=()=>ls('bh_key_'+$('prov').value,$('key').value.trim());
$('model').onchange=()=>ls('bh_model_'+$('prov').value,$('model').value.trim());
syncPv();
$('ex').onclick=()=>{$('in').value=EX};
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText(md);$('st').textContent='copied.'}catch(e){$('st').textContent='copy failed — select the raw markdown below.'}};
const runGo=async()=>{
  items=split($('in').value);trs=null;edits={};
  if(!items.length){$('st').textContent='paste a shloka first.';return}
  $('go').disabled=true;render();
  if(!$('oE').checked){$('st').textContent='done.';$('go').disabled=false;return}
  const pv=$('prov').value;
  $('st').textContent='translating…';
  const prompt='Translate each Sanskrit shloka below into English, in the style of traditional stotra translations: literal and faithful, with clarifying parentheticals where helpful (e.g. "(of the Śrī Cakra)"), and epithets separated by semicolons, each starting with "She who"/"He who" etc. when the original is an epithet list. Example for "नवावरणसम्पूज्या नवाक्षरमनुस्तुता । नवलावण्यरूपाढ्या ज्वलद्द्वात्रिंशतायुधा ॥ १३ ॥": She who is worshipped through the nine enclosures (of the Śrī Cakra); she who is praised through the nine syllable mantra (Navākṣarī); she who is endowed with a form of ever-fresh beauty; she who bears thirty-two blazing weapons\n\nPunctuate so the translations read continuously across consecutive shlokas: end a translation with a period when its sentence is complete, but end it with a comma or semicolon when the sentence or list (e.g. a nāmāvalī or stotra epithet list) continues into the next shloka. Return ONLY a JSON array of strings, one translation per shloka, in order, no markdown, no asterisks.\n\nShlokas:\n'+items.map((d,i)=>(i+1)+'. '+d.replace(/\n/g,' ')).join('\n');
  const parse=t=>{const a=JSON.parse((t||'').replace(/```json|```/g,'').trim());if(!Array.isArray(a))throw 0;return a.map(String)};
  try{
    if(pv==='claude'){
      let sample=null;
      try{sample=await claude.use('sample')}catch(e){}
      if(!sample){$('st').textContent='“claude” only works when this page is opened inside claude — pick another translator.';$('go').disabled=false;return}
      trs=parse((await sample(prompt,{cache:false})).text);
    }else{
      const key=($('key').value||'').trim(),model=($('model').value||'').trim()||PV[pv].model;
      if(!key){$('st').textContent='enter your '+pv+' api key first ('+PV[pv].ph.toLowerCase()+').';$('go').disabled=false;return}
      let res,text;
      if(pv==='anthropic')res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:4000,messages:[{role:'user',content:prompt}]})});
      else if(pv==='gemini')res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
      else res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+key},body:JSON.stringify({model,messages:[{role:'user',content:prompt}]})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw {code:'api',message:(data.error&&(data.error.message||JSON.stringify(data.error)))||('http '+res.status)};
      if(pv==='anthropic')text=(data.content||[]).map(c=>c.text||'').join('');
      else if(pv==='gemini')text=((data.candidates||[])[0]?.content?.parts||[]).map(c=>c.text||'').join('');
      else text=(data.choices||[])[0]?.message?.content||'';
      trs=parse(text);
    }
    render();$('st').textContent='done.';
  }catch(e){
    $('st').textContent=(e&&e.code==='not_granted')?'translation permission was declined.':(e&&e.code==='api')?'translation failed: '+String(e.message).toLowerCase():'translation failed (network blocked or bad response).';
  }
  $('go').disabled=false;
};
$('go').onclick=async()=>{await runGo();saveNow()};

// ---- recent projects (saved in this browser) ----
const PK='bh_projects',OPTS=['oD','oT','oB','oI','oE'],SELS=['tst','bst','rom'];
let curId=null,saveT=null;
const fmt=t=>new Date(t).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).toLowerCase();
function loadAll(){try{return JSON.parse(ls(PK)||'[]')||[]}catch(e){return[]}}
function storeAll(a){ls(PK,JSON.stringify(a.slice(0,30)))}
function pname(){const f=($('fn').value||'').trim();if(f)return f;return ($('in').value.trim().split('\n')[0]||'').slice(0,28)||'untitled'}
function paintList(){
  const a=loadAll();
  $('plist').innerHTML=a.length?a.map(p=>'<div class="pi'+(p.id===curId?' on':'')+'" data-id="'+esc(p.id)+'"><div class="pt"><span class="pn">'+esc(p.name)+'</span><span class="pd">'+esc(fmt(p.t))+'</span></div><button class="px" type="button" title="delete">×</button></div>').join(''):'<div class="pe">no projects yet. your work is saved here automatically.</div>';
}
function saveNow(){
  clearTimeout(saveT);
  if(!$('in').value.trim())return;
  if(!curId)curId='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const o={};OPTS.forEach(k=>o[k]=$(k).checked);SELS.forEach(k=>o[k]=$(k).value);
  const proj={id:curId,name:pname(),t:Date.now(),input:$('in').value,items,trs,edits,fn:$('fn').value,o};
  storeAll([proj].concat(loadAll().filter(x=>x.id!==curId)));paintList();
}
const schedule=()=>{clearTimeout(saveT);saveT=setTimeout(saveNow,700)};
function clearOut(){$('res').innerHTML='';$('raw').textContent='';$('rawd').hidden=true;['cp','dm','dt'].forEach(id=>$(id).disabled=true)}
function openProj(id){
  const p=loadAll().find(x=>x.id===id);if(!p)return;
  clearTimeout(saveT);
  curId=p.id;$('in').value=p.input||'';$('fn').value=p.fn||'';
  OPTS.forEach(k=>{if(p.o&&k in p.o)$(k).checked=p.o[k]});
  SELS.forEach(k=>{if(p.o&&p.o[k])$(k).value=p.o[k]});
  items=p.items||[];trs=p.trs||null;edits=p.edits||{};
  $('tsw').hidden=!$('oT').checked;$('bsw').hidden=!$('oB').checked;$('rsw').hidden=!$('oI').checked;
  $('st').textContent='';
  if(items.length)render();else clearOut();
  paintList();
}
$('plist').addEventListener('click',e=>{
  const row=e.target.closest('.pi');if(!row)return;
  const id=row.dataset.id,b=e.target.closest('.px');
  if(b){
    if(b.dataset.arm){storeAll(loadAll().filter(x=>x.id!==id));if(curId===id)curId=null;paintList()}
    else{b.dataset.arm='1';b.textContent='delete?';setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='×'}},2500)}
    return;
  }
  openProj(id);
});
$('np').onclick=()=>{saveNow();curId=null;$('in').value='';$('fn').value='';items=[];trs=null;edits={};clearOut();$('st').textContent='';paintList();$('in').focus()};
['in','fn'].forEach(id=>$(id).addEventListener('input',schedule));
$('res').addEventListener('input',schedule);
OPTS.concat(SELS).forEach(id=>$(id).addEventListener('change',schedule));
paintList();

// ---- ui color ----
const PRESETS=['','#4f5bd5','#1f8a8a','#3f7d3a','#c2456b','#8e4fb3','#50607a'];
function hex2hsl(h){
  const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,L=(mx+mn)/2;let H=0,S=0;
  if(d){S=d/(1-Math.abs(2*L-1));if(mx===r)H=((g-b)/d)%6;else if(mx===g)H=(b-r)/d+2;else H=(r-g)/d+4;H*=60;if(H<0)H+=360}
  return [H,S*100,L*100];
}
const hsl=(h,s,l)=>'hsl('+Math.round(h)+','+Math.round(s)+'%,'+Math.round(l)+'%)';
function applyColor(){
  const c=(ls('bh_color')||'').toLowerCase(),st=document.documentElement.style;
  ['--bg','--fg','--mut','--card','--bd','--ac','--acfg'].forEach(v=>st.removeProperty(v));
  if(/^#[0-9a-f]{6}$/.test(c)){
    const [h,s0,l]=hex2hsl(c),s=Math.min(s0,40),dark=curTheme()==='dark';
    const rgb=[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)),bright=0.299*rgb[0]+0.587*rgb[1]+0.114*rgb[2]>150;
    const v=dark?{'--bg':hsl(h,s*.5,10),'--card':hsl(h,s*.5,14),'--bd':hsl(h,s*.4,24),'--mut':hsl(h,s*.3,64),'--fg':hsl(h,s*.4,92),'--ac':hsl(h,Math.min(s0,70),Math.max(l,64)),'--acfg':'#1b1815'}
      :{'--bg':hsl(h,s,96),'--card':hsl(h,s,99),'--bd':hsl(h,s*.6,86),'--mut':hsl(h,s*.3,42),'--fg':hsl(h,s*.5,13),'--ac':c,'--acfg':bright?'#1b1815':'#ffffff'};
    for(const k in v)st.setProperty(k,v[k]);
  }
  $('sws').querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===c));
  if(/^#[0-9a-f]{6}$/.test(c))$('cc').value=c;
}
$('sws').innerHTML=PRESETS.map(c=>'<button type="button" class="sw'+(c?'':' def')+'" data-c="'+c+'" title="'+(c||'default')+'"'+(c?' style="background:'+c+'"':'')+'></button>').join('');
$('sws').addEventListener('click',e=>{const b=e.target.closest('.sw');if(!b)return;ls('bh_color',b.dataset.c);applyColor()});
$('cc').addEventListener('input',()=>{ls('bh_color',$('cc').value);applyColor()});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyColor)}catch(e){}
applyColor();
</script>
